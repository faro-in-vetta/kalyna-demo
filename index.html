<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Демо CRM для магазину вишиванок «Калина»: залишки по розмірах, замовлення, Нова Пошта, етикетки зі штрихкодом, сканер.">
<meta property="og:title" content="Калина CRM — демо"><meta property="og:description" content="Склад, замовлення, етикетки й сканер для kalyna.store. Розробка FARO IN VETTA.">
<meta property="og:image" content="https://kalyna.faroinvetta.com/og.png"><meta property="og:url" content="https://kalyna.faroinvetta.com/"><meta property="og:type" content="website">
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><meta name="theme-color" content="#ffffff">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Калина CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: формат складу DG — липка шапка (лого + підсумок, пошук з кнопкою поруч, рядок фільтрів), картки-рядки з фото праворуч, нижнє меню з іконками; кольори й шрифти «Калини» */
:root{
  --bg:#ffffff; --surface:#ffffff; --page:#f6f5f2; --ink:#111111; --muted:#5e5e5e; --soft:#9a9a9a;
  --line:#e3e1dd; --line2:#d0ccc5; --tint:#f6efe5; --sand:#c1a288;
  --red:#c90b12; --red-soft:#fbe9e9; --ok:#2f7a4a; --ok-soft:#e7f3eb; --warn:#a86400; --warn-soft:#fdf1dc; --blue:#2f5ea8; --blue-soft:#e8eef8;
  --f-display:'Noto Serif','PT Serif','Times New Roman',serif;
  --f-ui:'Onest','Segoe UI','Noto Sans',Arial,sans-serif;
  --nav-h:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
.num,.money{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.demo{background:var(--ink);color:#fff;font-size:12px}
.demo .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:5px;flex-wrap:wrap}
.demo b{color:#ffb3b5;font-weight:600}
.demo select{background:#222;border:1px solid #444;color:#fff;padding:2px 6px;font-size:12px}

/* шапка */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2.5px solid var(--red);box-shadow:0 2px 8px rgba(0,0,0,.05)}
header.top .wrap{padding-block:10px 10px}
.top-row{display:flex;align-items:center;gap:10px;min-height:44px}
.brand{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.logo{height:40px;width:auto;flex:none}
.logo-ic{display:none;height:38px;flex:none}
#catSum{min-width:0;line-height:1.2;border-left:1px solid var(--line);padding-left:14px}
#catSum .cs1{font:400 20px/1.1 var(--f-display)}
#catSum .cs2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.online{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;flex:none;font-size:13px;cursor:pointer}
.online .avs{display:flex}
.online .av{width:26px;height:26px;border-radius:50%;background:var(--tint);border:2px solid var(--surface);display:grid;place-items:center;font-size:11px;font-weight:600;margin-left:-8px}
.online .av:first-child{margin-left:0}
.online .av.me{background:var(--ink);color:#fff}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.gear{background:var(--surface);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;flex:none;display:grid;place-items:center;cursor:pointer}
.gear svg{width:20px;height:20px}
.search{margin-top:10px;display:flex;gap:8px}
.qwrap{position:relative;flex:1;min-width:0}
.qwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--soft)}
.qwrap input{width:100%;height:42px;padding:0 12px 0 40px;border:1px solid var(--line2);background:var(--surface);border-radius:0}
.qwrap input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,17,17,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;font-weight:600;white-space:nowrap;flex:none}
.btn:hover{opacity:.85}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;font-weight:500}
.btn.wide{flex:1}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn:focus-visible,.cf:focus-visible,nav.tabs button:focus-visible,.sku:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* фільтри під пошуком */
.catf{margin-top:8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.catf::-webkit-scrollbar{display:none}
.cf{height:30px;padding:0 10px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;font-size:12.5px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:4px;flex:none}
.cf .ar{font-size:9px;color:var(--soft)}
.cf.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cf.on .ar{color:#bbb}
.cf.clr{border-style:dashed;color:var(--muted)}
.cfpop{position:fixed;z-index:45;background:var(--surface);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.14);width:min(300px,calc(100vw - 32px));max-height:min(420px,70vh);display:flex;flex-direction:column}
.cfpop .lst{overflow-y:auto;padding:6px 0}
.cfo{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.cfo:hover{background:var(--page)}
.cfo input{accent-color:var(--ink);width:16px;height:16px}
.cfo .c{margin-left:auto;color:var(--soft);font-size:12px}
.cfo.all{border-bottom:1px solid var(--line);font-weight:600}
.cfpop .ft{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}

main{padding-block:12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
h2.sec{font:600 15px/1.3 var(--f-ui);margin:16px 0 8px}

/* картка товару — як .sku на складі */
.sku{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:6px;background:var(--surface);border:1px solid var(--line);padding:10px;margin-bottom:6px;width:100%;text-align:left;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 130px}
.sku:hover{border-color:var(--line2)}
.sku .body{grid-column:1;grid-row:1;min-width:0}
.sku .nm{font-weight:600;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sku .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.sku .meta .code{font-family:ui-monospace,Menlo,Consolas,monospace}
.sku .scol{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:center;gap:6px}
.thumb{width:74px;height:111px;object-fit:cover;background:var(--tint);display:block;flex:none}
.sku .levels{grid-column:1;grid-row:2;display:flex;flex-wrap:wrap;gap:4px;align-self:end}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid var(--line)}
.chip.sale{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.old{color:var(--soft);text-decoration:line-through;border-color:transparent;padding:0 2px}
.chip.free{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.resv{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.zero{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.last{background:var(--tint);color:#7a5a3c;border-color:transparent}
.chip.off{background:var(--page);color:var(--muted);border-color:transparent}
.sizes{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.sz{min-width:30px;height:22px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;gap:3px;border:1px solid var(--line2);font-size:11px;background:var(--surface)}
.sz i{font-style:normal;font-size:10px;color:var(--muted)}
.sz.low{border-color:var(--warn);background:var(--warn-soft)}
.sz.zero{color:var(--soft);background:var(--page);border-style:dashed}
.more{display:block;width:100%;margin:10px 0;height:40px;border:1px dashed var(--line2);background:var(--surface);cursor:pointer;color:var(--muted)}

/* заявки / замовлення */
.ostat{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.ostat::-webkit-scrollbar{display:none}
.ord{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);padding:10px 12px;margin-bottom:6px;cursor:pointer;width:100%;text-align:left;align-items:center}
.ord:hover{border-color:var(--line2)}
.ord .no{font-weight:700;font-size:15px}
.ord .cl{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .sum{font-weight:600;text-align:right}
.ord .row2{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.ord .pics{display:flex;gap:3px;margin-left:auto}
.ord .pics img{width:24px;height:36px;object-fit:cover;background:var(--tint)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-new{background:var(--red-soft);color:var(--red)}
.p-conf{background:var(--blue-soft);color:var(--blue)}
.p-packed{background:var(--warn-soft);color:var(--warn)}
.p-sent{background:var(--tint);color:#7a5a3c}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-ret,.p-cancel{background:var(--page);color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tag.opt{border-color:var(--sand);color:#7a5a3c;background:var(--tint)}

/* блоки */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);padding:10px 12px}
.tile .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tile .v{font:400 22px/1.15 var(--f-display);margin-top:3px}
.tile .s{font-size:11.5px;color:var(--muted)}
.tile.hot .v{color:var(--red)}
.panel{background:var(--surface);border:1px solid var(--line);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.panel .row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s2{color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:16px 0;text-align:center}
.hint{font-size:12px;color:var(--muted)}

/* нижнє меню */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:2.5px solid var(--red);box-shadow:0 -2px 8px rgba(0,0,0,.05);display:flex;justify-content:center;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:25}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:4px 0;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav.tabs svg{width:22px;height:22px;box-sizing:content-box;padding:4px 14px;border-radius:999px;transition:background .15s}
nav.tabs button[aria-current="true"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="true"] svg{background:var(--red-soft);color:var(--red)}
nav.tabs .cnt{position:absolute;top:0;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;line-height:17px;font-weight:700}

/* вікно */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panelx{background:var(--surface);width:min(640px,100%);max-height:94dvh;overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2.5px solid var(--red)}
@media (min-width:700px){.sheet{align-items:center}.panelx{max-height:90dvh}}
.ph{position:sticky;top:0;background:var(--surface);display:flex;align-items:flex-start;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px;z-index:2}
.ph h3{flex:1;font:400 19px/1.25 var(--f-display);margin:0;text-wrap:balance}
.ph .eye{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.ph.same h3{font:400 19px/1.3 var(--f-display)}
.x{width:36px;height:36px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;flex:none}
.skuhead{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:14px;margin-bottom:12px}
.skuhead img{width:120px;height:180px;object-fit:cover;background:var(--tint)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.acts .btn{flex:1;min-width:140px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);background:var(--page)}
td{padding:8px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);margin-bottom:10px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select{height:40px;border:1px solid var(--line2);background:var(--surface);padding:0 10px;color:var(--ink);font-size:14px;width:100%;min-width:0}
label.f input:focus,label.f select:focus{outline:none;border-color:var(--ink)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.steps{display:flex;flex-wrap:wrap;font-size:11.5px;margin-bottom:10px}
.steps span{padding:4px 8px;border:1px solid var(--line);margin-left:-1px;color:var(--soft)}
.steps span.done{color:var(--ink);background:var(--page)}
.steps span.cur{color:#fff;background:var(--ink);border-color:var(--ink)}
.ttn{background:var(--tint);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ttn b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;letter-spacing:.05em}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px;margin-top:6px}
.total b{font:400 24px/1 var(--f-display)}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:20px;border-bottom:1px solid var(--line2)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar .col{width:100%;max-width:46px;background:var(--line2)}
.bar.cur .col{background:var(--red)}
.bar .val{font-size:10.5px;color:var(--muted);white-space:nowrap}
.blab{display:flex;gap:10px;margin-top:6px}.blab span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(70px,140px) 1fr 54px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}
.hbar .tr{height:9px;background:var(--page)}.hbar .fi{height:100%;background:var(--ink)}.hbar .fi.red{background:var(--red)}
.hbar .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.hbar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scanbox{background:var(--ink);color:#fff;aspect-ratio:4/3;max-width:420px;margin:0 auto 12px;display:grid;place-items:center;position:relative}
.scanbox::before{content:"";position:absolute;inset:22% 14%;border:2px solid rgba(255,255,255,.85)}
.scanbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanbox.live span{display:none}
.scanbox span{position:relative;font-size:13px;opacity:.8;text-align:center;padding:0 20px}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px;margin:10px 0}
.lab{width:232px;height:160px;max-width:100%;background:#fff;border:1px solid var(--line2);padding:8px 10px;display:grid;grid-template-rows:auto 1fr auto;gap:2px;color:#000;position:relative}
.lab .lt{display:flex;align-items:center;gap:6px}
.lab .lt img{height:22px}
.lab .lt .code{margin-left:auto;font:600 11px ui-monospace,Menlo,Consolas,monospace}
.lab .ltx{font-size:11.5px;line-height:1.25;font-weight:500;min-width:0;padding-top:14px}
.lab .ln{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lab .lrow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
.lab .lrow b{font-size:15px}
.lab svg{width:100%;height:50px;display:block}
.lab .cnt{position:absolute;top:-8px;right:-8px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.bcmini svg{height:26px;width:auto;max-width:150px;display:block}
.qstep{display:inline-flex;align-items:center;border:1px solid var(--line2)}
.qstep button{width:28px;height:28px;border:0;background:var(--page);cursor:pointer;font-size:16px}
.qstep span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.phs{display:flex;gap:8px;margin-bottom:12px}
.phslot{width:88px;height:132px;border:1px dashed var(--line2);background:var(--page);display:grid;place-items:center;position:relative;cursor:pointer;font-size:12px;color:var(--muted);text-align:center;flex:none}
.phslot:hover{border-color:var(--ink);color:var(--ink)}
.phslot img{width:100%;height:100%;object-fit:cover;display:block}
.phslot .rm{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:13px;line-height:22px;cursor:pointer}
.phslot .main{position:absolute;left:0;bottom:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 0}
.gal{display:flex;gap:6px;margin-top:6px}.gal img{width:36px;height:57px;object-fit:cover;cursor:pointer;border:1px solid var(--line)}.gal img.on{border-color:var(--ink)}
.btn.del{color:var(--red);border-color:var(--line2)}
.btn.del.arm{background:var(--red);color:#fff;border-color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:10px 16px;font-size:13px;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;white-space:pre-line}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:899px){
  .brand .dgx{display:none}
  #catSum{order:5;flex-basis:100%;border-left:0;padding:8px 0 0}
  .top-row{flex-wrap:wrap}
  .brand{flex:1}
}
@media (max-width:560px){

const GRIDS=[['w','Жіночі 40–52','40,42,44,46,48,50+100,52+100'],['m','Чоловічі 46–62','46,48,50,52,54,56,58+100,60+100,62+200'],['k','Дитячі 104–158','104,110,116,122,128,134,140,146,152+100,158+100'],['kp','Дитячі парами 104–158','104-110,116-122,128-134,140-146,152-158+100'],['x','XS–XXL','XS,S,M,L,XL+100,XXL+200'],['one','Один розмір',''],['own','Своя сітка…','']];
let NS=null;
const nextSkuId=()=>Math.max(...S.products.filter(p=>p.id<9000).map(p=>p.id))+1;
function parseGrid(t){const sizes=[],extra={};(t||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{const m=x.match(/^([^+]+?)\s*(?:\+\s*(\d+))?$/);if(m){sizes.push(m[1].trim());if(m[2])extra[m[1].trim()]=+m[2]}});if(!sizes.length)sizes.push('—');return {sizes,extra}}
const canEditSku=()=>can('stock')||can('cost');
const isAdm=()=>S.role==='admin';
const gridText=p=>p.sizes[0]==='—'?'':p.sizes.map(s=>p.extra[s]?s+'+'+p.extra[s]:s).join(',');
function newSku(editId){const cats=[...new Set(S.products.map(p=>p.cat))].sort((a,b)=>a.localeCompare(b,'uk'));
  const E=editId?prod(editId):null;

  const nextId=nextSkuId();
  sheet(E?E.code+(E.art?' · арт. '+esc(E.art):''):'KL'+String(nextId).padStart(4,'0')+' · штрихкод присвоїться сам',E?'Коригування картки':'Нове SKU',`
  <div class="hint" style="margin-bottom:4px">Фото, до 3 шт · перше — головне</div><div class="phs" id="nPh"></div><input id="nP" type="file" accept="image/*" multiple hidden>
  <label class="f" style="margin-bottom:10px">Назва<input id="nN" placeholder="напр. Жіноча лляна вишиванка «Калина»" autocomplete="off" value="${E?esc(E.name):''}"></label>
  <div class="f2"><label class="f">Артикул<input id="nA" placeholder="напр. KS0203160" autocomplete="off" value="${E?esc(E.art||''):''}"></label><label class="f">Категорія<select id="nC">${cats.map(c=>`<option ${c===(E?E.cat:'Вишиті жіночі сорочки')?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
  <div class="f2"><label class="f">Розмірна сітка<select id="nG">${GRIDS.map(([k,l])=>`<option value="${k}" ${k===NS.grid?'selected':''}>${l}</option>`).join('')}</select></label><label class="f" id="nOwnL" ${NS.grid==='own'?'':'hidden'}>Розміри через кому, доплата через «+»<input id="nOwn" placeholder="напр. 42,44,46,48+100" value="${E?esc(gridText(E)):''}"></label></div>
  ${E?(isAdm()?'<p class="hint" style="margin:-4px 0 10px">Права адміна: змінюються всі поля, розміри, залишки й ціни без обмежень.</p>':'<p class="hint" style="margin:-4px 0 10px">Розмір можна додати будь-коли; прибрати — лише якщо його немає на складі й у резерві. Кількість змінюється через «Операція» в картці.</p>'):''}
  <div id="nQty"></div>
  ${E&&!isAdm()?'':can('cost')?`<div class="f2"><label class="f">Собівартість, грн<input id="nCo" type="number" min="0" inputmode="numeric" value="${E&&E.cost?E.cost:''}"></label><label class="f">Ціна продажу (роздріб), грн<input id="nR" type="number" min="0" inputmode="numeric" value="${E&&E.price?E.price:''}"></label></div>
  <div class="f2"><label class="f">Оптова ціна, грн<input id="nO" type="number" min="0" inputmode="numeric" placeholder="за замовчуванням −22%" value="${E&&E.opt?E.opt:''}"></label><label class="f">Стара ціна (для знижки), грн<input id="nOld" type="number" min="0" inputmode="numeric" placeholder="без знижки" value="${E&&E.old?E.old:''}"></label></div>`:'<p class="hint">Ціни внесе власник або бухгалтер — до того модель буде з позначкою «без ціни».</p>'}${E&&can('cost')&&!isAdm()?'<p class="hint">Ціни змінюються в блоці «Ціни» в картці товару.</p>':''}
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0 10px"><input id="nSite" type="checkbox" ${!E||E.onSite?'checked':''} style="width:16px;height:16px;accent-color:var(--ink)"> Показувати на сайті, коли з’явиться залишок</label>

function drawPh(){const el=$('#nPh');if(!el)return;el.innerHTML=[0,1,2].map(i=>NS.photos[i]?`<div class="phslot"><img src="${NS.photos[i]}" alt="">${i===0?'<span class="main">головне</span>':''}<button class="rm" data-act="phrm" data-i="${i}" aria-label="Прибрати фото">×</button></div>`:`<div class="phslot" data-act="phadd" role="button" tabindex="0">+ Фото</div>`).join('')}
function nsGrid(){const g=$('#nG').value;NS.grid=g;return g==='own'?parseGrid($('#nOwn').value):parseGrid((GRIDS.find(x=>x[0]===g)||[])[2])}
function drawNQty(){if(NS&&NS.edit&&!isAdm()){$('#nQty').innerHTML='';return}const {sizes,extra}=nsGrid();const old={};const EP=NS&&NS.edit?prod(NS.edit):null;if(EP)sizes.forEach(s=>old[s]=EP.qty[s]||0);document.querySelectorAll('[data-nq]').forEach(i=>old[i.dataset.nq]=i.value);
  $('#nQty').innerHTML=`<div class="hint" style="margin-bottom:4px">${EP?'Залишок на складі по розмірах, шт':'Прихід по розмірах, шт (можна лишити 0 і провести пізніше)'}</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${sizes.map(s=>`<label class="f" style="width:76px;white-space:nowrap">${s==='—'?'кількість':esc(s)}${extra[s]?'<span style="color:var(--soft);font-size:10.5px"> +'+extra[s]+'</span>':''}<input data-nq="${esc(s)}" type="number" min="0" inputmode="numeric" value="${old[s]||0}"></label>`).join('')}</div>`}
function saveSku(){const name=$('#nN').value.trim();if(name.length<3)return toast('Вкажіть назву моделі');
  if(NS&&NS.edit)return saveSkuEdit(name);
  const {sizes,extra}=nsGrid();const qty={};sizes.forEach(s=>{const i=document.querySelector(`[data-nq="${CSS.escape(s)}"]`);qty[s]=Math.max(0,parseInt(i&&i.value)||0)});
  const v=id=>{const e=$(id);return e?Math.max(0,parseInt(e.value)||0):0};const price=v('#nR'),cost=v('#nCo');let opt=v('#nO');if(!opt&&price)opt=Math.round(price*.78/5)*5;const old=v('#nOld');
  if(old&&old<=price)return toast('Стара ціна має бути більшою за ціну продажу');
  const id=nextSkuId(),cat=$('#nC').value,who=ROLES[S.role].person;
  const p={id,code:'KL'+String(id).padStart(4,'0'),art:$('#nA').value.trim(),name,cat,grp:GROUP(cat),price,old,opt,cost,sizes,extra,qty:{},url:'https://kalyna.store/',onSite:$('#nSite').checked,photos:NS.photos.slice(),photo:NS.photos[0]||'',isNew:true};
  sizes.forEach(s=>{p.qty[s]=qty[s];if(qty[s])S.ops.unshift({d:nowStr(),pid:id,size:s,q:qty[s],t:'in',who,note:'Прихід при створенні SKU'})});
  S.products.unshift(p);PI.set(id,p);if(p.photo)TH[id]=p.photo;log(`Нове SKU ${p.code}: ${name}`);NS=null;changed();
  Object.keys(CF).forEach(k=>CF[k]=[]);Q='';$('#q').value='';render();openProd(id);toast(`SKU ${p.code} створено${tQty(p)?' · прихід '+tQty(p)+' шт':''}`)}
function saveSkuEdit(name){const p=prod(NS.edit),who=ROLES[S.role].person;const {sizes,extra}=nsGrid();
  const gone=p.sizes.filter(s=>!sizes.includes(s));const busy=isAdm()?[]:gone.filter(s=>(p.qty[s]||0)>0||reserved(p.id,s)>0);
  if(busy.length)return toast(`Не можна прибрати розмір ${busy.join(', ')}: він є на складі або в резерві`);
  const ch=[];const art=$('#nA').value.trim(),cat=$('#nC').value,onSite=$('#nSite').checked;
  if(name!==p.name)ch.push('назва');if(art!==(p.art||''))ch.push(`артикул ${p.art||'—'} → ${art||'—'}`);if(cat!==p.cat)ch.push(`категорія → ${cat}`);
  if(gridText({sizes,extra})!==gridText(p))ch.push(`розміри: ${sizes[0]==='—'?'один розмір':sizes.join(', ')}`);if(onSite!==p.onSite)ch.push(onSite?'показано на сайті':'приховано на сайті');
  const old=JSON.stringify(p.photos&&p.photos.length?p.photos:TH[p.id]?[TH[p.id]]:[]);if(old!==JSON.stringify(NS.photos))ch.push('фото');
  const qty={};sizes.forEach(s=>qty[s]=p.qty[s]||0);const adj=[];let pr=null;
  if(isAdm()){sizes.forEach(s=>{const i=document.querySelector(`[data-nq="${CSS.escape(s)}"]`);const n=Math.max(0,parseInt(i&&i.value)||0);if(n!==qty[s]){adj.push([s,n]);qty[s]=n}});
    gone.forEach(s=>{if(p.qty[s])adj.push([s,0])});if(adj.length)ch.push('залишки: '+adj.map(([s,n])=>(s==='—'?'':s+' → ')+n).join(', '));
    const v=id=>{const e=$(id);return e?Math.max(0,parseInt(e.value)||0):0};const c=v('#nCo'),r=v('#nR'),old=v('#nOld');let o=v('#nO');if(!o&&r)o=Math.round(r*.78/5)*5;
    if(old&&old<=r)return toast('Стара ціна має бути більшою за ціну продажу');
    if(c!==p.cost||r!==p.price||o!==p.opt||old!==(p.old||0)){pr={cost:c,price:r,opt:o,old};ch.push(`ціни: роздріб ${r}, опт ${o}, собівартість ${c}${old?', стара '+old:''}`)}}
  if(!ch.length){toast('Змін немає');return openProd(p.id)}
  Object.assign(p,{name,art,cat,grp:GROUP(cat),onSite,sizes,extra,qty,photos:NS.photos.slice(),photo:NS.photos[0]||'',noPhoto:!NS.photos.length},pr||{});
  adj.forEach(([s,n])=>S.ops.unshift({d:nowStr(),pid:p.id,size:s,q:n,t:'adj',who,note:'Коригування картки'}));
  if(p.photo)TH[p.id]=p.photo;else delete TH[p.id];
  S.ops.unshift({d:nowStr(),pid:p.id,size:'',q:0,t:'edit',who,note:ch.join(', ')});log(`Картку ${p.code} змінено: ${ch.join(', ')}`);
  NS=null;LQ={};changed();render();openProd(p.id);toast('Картку збережено')}
function delSku(id,btn){const p=prod(id);
  const inOrders=S.orders.some(o=>['new','conf','packed','sent'].includes(o.st)&&o.lines.some(l=>l.pid===id));
  if(!isAdm()&&tQty(p)>0)return toast(`Спершу обнуліть залишок: на складі ${tQty(p)} од.\nКоригування → 0 по кожному розміру`);
  if(!isAdm()&&inOrders)return toast('Модель є в активному замовленні — видалити не можна');
  if(!btn.classList.contains('arm')){btn.classList.add('arm');btn.textContent=tQty(p)?`Видалити разом із залишком ${tQty(p)} од.?`:'Точно видалити? Натисніть ще раз';clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.classList.remove('arm');btn.textContent='Видалити картку'},3500);return}
  p.deleted=true;p.onSite=false;S.ops.unshift({d:nowStr(),pid:id,size:'',q:0,t:'del',who:ROLES[S.role].person,note:'Картку видалено'});log(`Картку ${p.code} видалено: ${p.name}`);
  changed();closeSheet();render();toast(`Картку ${p.code} видалено`)}
function readPhotos(files){[...files].slice(0,3-NS.photos.length).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{if(NS.photos.length>=3)return;const W=240,H=360,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');const k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;g.drawImage(im,(W-w)/2,(H-h)/2,w,h);NS.photos.push(c.toDataURL('image/webp',.75));drawPh()};im.src=r.result};r.readAsDataURL(f)})}

function openOrder(no){
  const o=S.orders.find(x=>x.no===no),c=cli(o.client),pr=can('price')||isClient();const idx=FLOW.indexOf(o.st);
  const steps=['ret','cancel'].includes(o.st)?`<div class="steps"><span class="cur">${ST[o.st]}</span></div>`:`<div class="steps">${FLOW.map((k,i)=>`<span class="${i<idx?'done':i===idx?'cur':''}">${ST[k]}</span>`).join('')}</div>`;
  const a=[];
  if(!isClient()){
    if(o.st==='new'&&can('order'))a.push(`<button class="btn" data-act="st" data-no="${no}" data-to="conf">Підтвердити</button>`,`<button class="btn ghost" data-act="st" data-no="${no}" data-to="cancel">Скасувати</button>`);

    if(o.st==='done'&&can('order'))a.push(`<button class="btn ghost" data-act="st" data-no="${no}" data-to="ret">Повернення / обмін</button>`);
    if(!o.paid&&can('fin')&&!['cancel','ret'].includes(o.st))a.push(`<button class="btn ghost" data-act="paid" data-no="${no}">Оплачено</button>`);
  }

async function startScan(){

  $('#scanBox').classList.add('live');$('#camBtn').textContent='Зупинити камеру';scanMsg('Наведіть на штрихкод, тримайте 10–15 см від етикетки');

  if(bd){const tick=async()=>{if(!SCAN_STREAM)return;v=$('#scanVideo')||v;if(SCAN_PAUSED||!v.videoWidth){SCAN_TIMER=setTimeout(tick,250);return}try{const r=await bd.detect(v);if(r&&r.length)onCode(r[0].rawValue)}catch(e){}SCAN_TIMER=setTimeout(tick,180)};tick();return}

  if(window.Quagga){const c=document.createElement('canvas'),g=c.getContext('2d');let busy=false;
    const tick=async()=>{if(!SCAN_STREAM)return;v=$('#scanVideo')||v;if(SCAN_PAUSED){SCAN_TIMER=setTimeout(tick,250);return}if(v.videoWidth&&!busy){busy=true;const k=Math.min(1,1280/v.videoWidth);c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);g.drawImage(v,0,0,c.width,c.height);

        busy=false;if(code&&SCAN_STREAM)onCode(code)}

  if(!window.ZXing){stopScan();return scanMsg('Сканер не завантажився.',true)}
  const reader=new ZXing.MultiFormatOneDReader(new Map([[ZXing.DecodeHintType.TRY_HARDER,true]]));const c=document.createElement('canvas'),g=c.getContext('2d',{willReadFrequently:true});
  let pass=0;
  const tick=()=>{if(!SCAN_STREAM)return;const vw=v.videoWidth,vh=v.videoHeight;if(vw){
      // чергуємо: весь кадр / центр кадру, збільшений удвічі (дрібні або далекі етикетки)
      const crop=pass++%2===1;const sx=crop?vw*.15:0,sy=crop?vh*.2:0,sw=crop?vw*.7:vw,sh=crop?vh*.6:vh;const k=crop?Math.min(2,1600/sw):Math.min(1,1280/vw);

    SCAN_TIMER=setTimeout(tick,120)};tick();
}
function stopScan(){clearTimeout(SCAN_TIMER);SCAN_TIMER=null;if(SCAN_STREAM){SCAN_STREAM.getTracks().forEach(t=>t.stop());SCAN_STREAM=null}if(RD){try{RD.reset()}catch(e){}RD=null}const v=$('#scanVideo');if(v){v.srcObject=null;v.hidden=true;$('#scanBox').classList.remove('live');$('#camBtn').textContent='Увімкнути камеру'}}

async function labelCanvas(p,s){const K=10,W=58*K,H=40*K,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);const lg=await logoImg();if(lg)g.drawImage(lg,22,16,Math.round(46*lg.width/lg.height),46);
  g.fillStyle='#000';g.textBaseline='top';const F='Onest,"Segoe UI",Arial,sans-serif';g.font='500 25px '+F;
  let y=92;wrap(g,p.name,W-44,2).forEach(l=>{g.fillText(l,22,y);y+=30});

  const bc=document.createElement('canvas');JsBarcode(bc,bcText(p,s),{format:'CODE128',width:3,height:110,margin:0,fontSize:22,textMargin:2,font:'monospace'});

async function labelsPdf(p,map){if(!window.jspdf||!window.JsBarcode)return toast('Модуль PDF не завантажився');

  if(!n)return toast('Немає етикеток для друку');download(doc.output('blob'),`Етикетки ${p.code} (${n} шт).pdf`)}
function barcodesCsv(list,name){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Штрихкод','Назва','Артикул','Розмір','Категорія','На складі','Вільно',can('price')?'Ціна, грн':''].filter(Boolean)];
  list.forEach(p=>p.sizes.forEach(s=>rows.push([bcText(p,s),p.name,p.art,s==='—'?'':s,p.cat,p.qty[s]||0,free(p,s)].concat(can('price')?[p.price+(p.extra[s]||0)]:[]))));
  download(new Blob(['﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),name)}

/* ---------- Історія ---------- */
function vJournal(){const T={in:'Прихід',out:'Відвантаження',ret:'Повернення',adj:'Коригування'};
  const ops=S.ops.filter(o=>T[o.t]).slice(0,40).map(o=>[o.d,`${T[o.t]}: ${prod(o.pid)?.name||''} · ${o.size} · ${o.t==='adj'?'залишок ':''}${o.q} шт (${o.who})`]);
  const all=[...S.feed,...ops].sort((a,b)=>b[0].localeCompare(a[0]));
  return `<div class="panel">${all.map(([d,m])=>`<div class="row"><div class="grow">${esc(m)}</div><span class="hint" style="white-space:nowrap">${dShort(d)} ${d.slice(11)}</span></div>`).join('')}</div>`}

/* ---------- Аналітика ---------- */
function vStats(){
  const done=S.orders.filter(o=>o.st==='done');const rev=done.reduce((a,o)=>a+oSum(o),0);
  const series=[['тра',186400],['чер',214900],['лип',158300],['сер',142700],['вер',228900],['жов',rev+196000]];const mx=Math.max(...series.map(s=>s[1]));
  const P=S.products.filter(p=>!p.deleted);const units=P.reduce((a,p)=>a+tQty(p),0),val=P.reduce((a,p)=>a+tQty(p)*p.price,0),cost=P.reduce((a,p)=>a+tQty(p)*p.cost,0);
  const byG={};P.forEach(p=>{byG[p.grp]=(byG[p.grp]||0)+tQty(p)*p.price});const gm=Math.max(...Object.values(byG));
  const szD={'40':6,'42':14,'44':21,'46':17,'48':9,'50':4,'52':2};const szM=21;
  const ch={site:61,insta:18,viber:6,phone:5,opt:10};
  const all=S.orders.filter(o=>o.st!=='cancel'),ret=S.orders.filter(o=>o.st==='ret').length;
  return `<div class="tiles"><div class="tile"><div class="l">Виручка жовтня</div><div class="v num">${money(series[5][1])}</div><div class="s">демо-історія до вересня</div></div>
  <div class="tile"><div class="l">Склад за роздрібом</div><div class="v num">${money(val)}</div><div class="s">${fmtN(units)} од. · ${P.length} моделей</div></div>
  <div class="tile"><div class="l">Склад за собівартістю</div><div class="v num">${money(cost)}</div><div class="s">середня націнка ${Math.round((val/cost-1)*100)}%</div></div></div>
  <div class="panel"><h2 class="sec" style="margin-top:0">Виручка по місяцях</h2><div class="bars">${series.map((s,i)=>`<div class="bar ${i===5?'cur':''}"><span class="val">${Math.round(s[1]/1000)} тис.</span><div class="col" style="height:${s[1]/mx*80}%"></div></div>`).join('')}</div><div class="blab">${series.map(s=>`<span>${s[0]}</span>`).join('')}</div></div>
  <div class="panel"><h2 class="sec" style="margin-top:0">Залишок за розділами, роздрібна вартість</h2>${Object.entries(byG).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hbar"><span>${k}</span><div class="tr"><div class="fi" style="width:${v/gm*100}%"></div></div><span class="n">${Math.round(v/1000)} тис.</span></div>`).join('')}</div>
  <div class="panel"><h2 class="sec" style="margin-top:0">Які розміри беруть · жіночі</h2>${Object.entries(szD).map(([k,v])=>`<div class="hbar"><span>${k}</span><div class="tr"><div class="fi ${v===szM?'red':''}" style="width:${v/szM*100}%"></div></div><span class="n">${v} шт</span></div>`).join('')}<p class="hint">44–46 продаються втричі швидше за 40 і 50 — підказка для пошиття.</p></div>
  <div class="panel"><h2 class="sec" style="margin-top:0">Звідки замовлення</h2>${Object.entries(ch).map(([k,v])=>`<div class="hbar"><span>${SRC[k]}</span><div class="tr"><div class="fi" style="width:${v}%"></div></div><span class="n">${v}%</span></div>`).join('')}<p class="hint">Повернень: ${Math.round(ret/all.length*100)}% · переважно через розмір.</p></div>`;
}

/* ---------- Експорт ---------- */
function vExport(){const cf=catList().length,all=baseList().length;const W=`<div class="panel"><div class="row"><div class="grow"><div style="font-weight:600">Штрихкоди всіх позицій</div><div class="s2">модель × розмір: штрихкод, назва, артикул, залишок · ${fmtN(S.products.reduce((a,p)=>a+p.sizes.length,0))} рядків</div></div><button class="btn sm" data-act="bcAll">Excel</button></div><div class="row"><div class="grow"><div style="font-weight:600">Штрихкоди за фільтром каталогу</div><div class="s2">${cf===all?'фільтр не задано — усі '+fmtN(all)+' моделей':fmtN(cf)+' моделей з '+fmtN(all)}</div></div><button class="btn sm" data-act="bcF">Excel</button></div></div><h2 class="sec">У робочій версії</h2>`;const L=[['Залишки по розмірах','модель × розмір: на складі, резерв, вільно, ціни'],['Замовлення за період','з клієнтами, ТТН і оплатами'],['Накладені платежі','що в дорозі, що зараховано, комісія НП'],['Оптові клієнти','обіг і борги'],['Прайс для опту','фото, артикул, розміри, оптова ціна'],['Каталог для сайту','вільний залишок для OpenCart']];
  return W+`<div class="panel">${L.map(([t,d],i)=>`<div class="row"><div class="grow"><div style="font-weight:600">${t}</div><div class="s2">${d}</div></div><button class="btn ghost sm" data-act="exp">Excel</button></div>`).join('')}</div><p class="hint">У робочій версії файли формуються з фото, як вивантаження каталогу на складі DG.</p>`}

/* ---------- Налаштування (шестерня) ---------- */
function openSettings(){
  const people=[['Андрій','admin'],['Оксана','acc'],['Марічка','manager'],['Софія','manager'],['Тарас','store'],['Етно-лавка','client']];
  sheet('Калина CRM','Налаштування',`
  <h2 class="sec" style="margin-top:0">Зв’язок з магазином і службами</h2>
  <div class="panel">${[['kalyna.store · OpenCart','замовлення з сайту сюди, вільний залишок по розмірах — на сайт',1],['Нова Пошта','ТТН одним натиском, статуси, накладені платежі',1],['LiqPay','онлайн-оплата позначає замовлення оплаченим',1],['Binotel','дзвінок відкриває картку клієнта',0]].map(([n,d,on])=>`<div class="row"><span class="syncdot" style="${on?'':'background:var(--soft)'}"></span><div class="grow"><div style="font-weight:600">${n}</div><div class="s2">${d}</div></div><span class="hint">${on?'підключено':'можна підключити'}</span></div>`).join('')}</div>
  ${can('people')?`<h2 class="sec">Люди й доступи</h2><div class="panel">${people.map(([n,r])=>`<div class="row"><div class="grow"><div style="font-weight:600">${n} <span class="hint" style="font-weight:400">· ${ROLES[r].name}</span></div><div class="s2">${ROLE_DESC[r]}</div></div></div>`).join('')}</div><p class="hint">Вхід за логіном і паролем, без пошти. Доступи видає власник.</p>`:`<p class="hint">${ROLE_DESC[S.role]}</p>`}
  <div class="acts"><button class="btn ghost" data-act="reset">Повернути демо-дані</button></div>`);
}

/* ---------- вікно ---------- */
function sheet(eye,title,body,same){$('#panel').innerHTML=`<div class="ph${same?' same':''}"><div style="flex:1;min-width:0">${same?`<h3>${title}</h3><h3>${eye}</h3>`:`<div class="eye">${eye}</div><h3>${title}</h3>`}</div><button class="x" data-act="close" aria-label="Закрити">×</button></div>${body}`;$('#sheet').classList.add('open');$('#panel').scrollTop=0}
function closeSheet(){$('#sheet').classList.remove('open');D=null;if(SCAN_STREAM&&TAB==='scan')setTimeout(()=>{SCAN_PAUSED=false;LAST_AT=Date.now()},400)}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCf();closeSheet()}});

/* ---------- події ---------- */
document.addEventListener('click',e=>{
  const pop=$('#cfPop');if(pop&&!pop.contains(e.target)&&!e.target.closest('[data-cf]'))closeCf();
  const t=e.target.closest('[data-tab],[data-cf],[data-cfclr],[data-cfx],[data-of],[data-open],[data-order],[data-act],[data-more],[data-pick]');if(!t)return;const ds=t.dataset;
  if(ds.tab){if(ds.tab!=='scan')stopScan();TAB=ds.tab;Q='';$('#q').value='';closeSheet();render();scrollTo(0,0);if(TAB==='scan')autoCam();return}
  if(ds.cf){if(pop&&pop.dataset.k===ds.cf)return closeCf();return openCf(ds.cf,t)}
  if(ds.cfclr){Object.keys(CF).forEach(k=>CF[k]=[]);render();return}
  if(ds.cfx)return applyCf(ds.cfx==='clear');
  if(ds.of!==undefined){OF=ds.of;render();return}
  if(ds.more){LIMIT+=60;$('#view').innerHTML=vCatalog();return}
  if(ds.pick){syncDraft();D.pick=ds.pick;return drawDraft()}
  if(ds.act)return act(ds.act,ds);
  if(ds.open){openProd(+ds.open);return}
  if(ds.order){openOrder(+ds.order);return}
});
function act(a,ds){
  const who=ROLES[S.role].person;
  if(a==='close')return closeSheet();
  if(a==='newOrder')return newOrder(ds.pid);
  if(a==='newProd')return newSku();
  if(a==='saveSku')return saveSku();
  if(a==='editSku')return newSku(+ds.id);
  if(a==='backProd'){NS=null;return openProd(+ds.id)}
  if(a==='delSku')return delSku(+ds.id,$('#delBtn'));
  if(a==='gal'){const p=prod(LQ.pid);if(p&&p.photos){$('#pBig').src=p.photos[+ds.i];document.querySelectorAll('.gal img').forEach((x,i)=>x.classList.toggle('on',i===+ds.i))}return}
  if(a==='phadd')return $('#nP').click();
  if(a==='phrm'){NS.photos.splice(+ds.i,1);return drawPh()}
  if(a==='__x')return toast('Демо: нова модель — назва, категорія, розмірна сітка, ціни, фото.\nНові товари з сайту підтягуються автоматично.');
  if(a==='st')return setStatus(+ds.no,ds.to);
  if(a==='paid'){const o=S.orders.find(x=>x.no===+ds.no);o.paid=true;log(`№${o.no} позначено оплаченим`);changed();toast('Оплату зараховано');render();return openOrder(o.no)}
  if(a==='label')return openLabels(+ds.id);
  if(a==='lqp'){LQ[ds.s]=Math.max(0,(LQ[ds.s]||0)+(+ds.d));const el=document.querySelector(`[data-lq="${CSS.escape(ds.s)}"]`);if(el)el.textContent=LQ[ds.s];const p=prod(LQ.pid),t=p.sizes.reduce((x,s)=>x+(LQ[s]||0),0);$('#lqTot').textContent=t;$('#lqBtn').disabled=!t;return}
  if(a==='lq'){LQ[ds.s]=Math.max(0,(LQ[ds.s]||0)+(+ds.d));return openLabels(LQ.pid)}
  if(a==='lprint')return labelsPdf(prod(LQ.pid),LQ);
  if(a==='cam')return startScan();
  if(a==='bcAll')return barcodesCsv(S.products.filter(p=>!p.deleted),'Штрихкоди Калина — усі.csv');
  if(a==='bcF')return barcodesCsv(catList(),'Штрихкоди Калина — вибірка.csv');
  if(a==='open')return openProd(+ds.id);
  if(a==='exp')return toast('У демо файл не формується');
  if(a==='toggleSite'){const p=prod(+ds.id);p.onSite=!p.onSite;log(`${p.code} ${p.onSite?'показано':'приховано'} на сайті`);changed();render();return openProd(p.id)}
  if(a==='op'){const p=prod(+ds.id),t=$('#opT').value,s=$('#opS').value,q=Math.max(0,parseInt($('#opQ').value)||0),n=$('#opN').value.trim();
    if(t==='in'&&!q)return toast('Вкажіть кількість');
    if(t==='in')p.qty[s]=(p.qty[s]||0)+q;else{if(q<reserved(p.id,s))return toast(`Не менше ${reserved(p.id,s)} — стільки в резерві`);p.qty[s]=q}
    S.ops.unshift({d:nowStr(),pid:p.id,size:s,q,t,who,note:n||(t==='in'?'Прихід':'Інвентаризація')});log(`${t==='in'?'Прихід':'Коригування'}: ${p.code} ${s} — ${q} шт`);changed();
    toast(t==='in'?`+${q} шт, розмір ${s}`:`Залишок ${s}: ${q} шт`);render();return openProd(p.id)}
  if(a==='prices'){const p=prod(+ds.id),v=id=>Math.max(0,parseInt($(id).value)||0);const c=v('#pC'),r=v('#pR'),o=v('#pO'),old=v('#pOld');
    if(!r)return toast('Вкажіть ціну продажу');if(old&&old<=r)return toast('Стара ціна має бути більшою за ціну продажу');
    const ch=[];if(c!==p.cost)ch.push(`собівартість ${p.cost} → ${c}`);if(r!==p.price)ch.push(`роздріб ${p.price} → ${r}`);if(o!==p.opt)ch.push(`опт ${p.opt} → ${o}`);if(old!==(p.old||0))ch.push(old?`стара ціна ${old}`:'знижку знято');
    if(!ch.length)return toast('Ціни не змінились');
    Object.assign(p,{cost:c,price:r,opt:o,old});S.ops.unshift({d:nowStr(),pid:p.id,size:'',q:0,t:'price',who,note:ch.join(', ')});log(`Ціни ${p.code}: ${ch.join(', ')}`);changed();toast('Ціни збережено — оновляться на сайті');render();return openProd(p.id)}
  if(a==='unpick'){syncDraft();D.pick='';return drawDraft()}
  if(a==='addLine'){syncDraft();const P=prod(+D.pick),s=$('#lS').value,q=parseInt($('#lQ').value)||0;const f=free(P,s)-D.lines.filter(l=>l.pid===P.id&&l.size===s).reduce((x,l)=>x+l.qty,0);
    if(q<1||q>f)return toast(`Вільно лише ${Math.max(0,f)} шт розміру ${s}`);
    D.lines.push({pid:P.id,size:s,qty:q,price:(cli(D.client).type==='opt'?P.opt:P.price)+(P.extra[s]||0)});D.pick='';D.pq='';return drawDraft()}
  if(a==='rmLine'){syncDraft();D.lines.splice(+ds.i,1);return drawDraft()}
  if(a==='saveOrder'){syncDraft();const no=S.seq++;S.orders.unshift({no,date:'2026-10-25',client:D.client,src:D.src,pay:D.pay,st:'new',lines:D.lines,np:D.np||'Відділення №1',ttn:'',paid:D.pay==='liqpay',note:''});
    log(`Нове замовлення №${no} (${SRC[D.src]}) — ${cli(D.client).name}`);changed();closeSheet();TAB='orders';OF='';render();toast(`Замовлення №${no} створено, розміри зарезервовано`);return}
  if(a==='scan'){const v0=($('#scanIn').value||'').trim();if(v0)return onCode(v0);const v=v0.toUpperCase();const m=v.match(/^KL0*(\d+)(?:-(.+))?$/);const p=m&&prod(+m[1]);if(!p)return toast('Код не знайдено');openProd(p.id);if(m[2]){const s=m[2];toast(`Розмір ${s}: на складі ${p.qty[s]??0}, резерв ${reserved(p.id,s)}, вільно ${p.sizes.includes(s)?free(p,s):0}`)}return}
  if(a==='reset'){S=seed();PI=new Map(S.products.map(p=>[p.id,p]));$('#roleSel').value='admin';changed();closeSheet();render();toast('Демо-дані відновлено');return}
}
document.addEventListener('input',e=>{if(e.target.id==='dQ'){D.pq=e.target.value;const pos=e.target.selectionStart;syncDraft();drawDraft();const dq=$('#dQ');if(dq)dq.setSelectionRange(pos,pos)}});
document.addEventListener('input',e=>{if(['pC','pR','pO'].includes(e.target.id)){const c=+$('#pC').value||0,r=+$('#pR').value||0,o=+$('#pO').value||0;$('#pMk').textContent=`націнка ${c?Math.round((r/c-1)*100):0}% · опт ${c?Math.round((o/c-1)*100):0}%`}});
document.addEventListener('change',e=>{if(e.target.id==='nG'){$('#nOwnL').hidden=e.target.value!=='own';drawNQty();return}if(e.target.id==='nP'){readPhotos(e.target.files);e.target.value='';return}});
document.addEventListener('input',e=>{if(e.target.id==='nOwn')drawNQty()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='scanIn'){e.preventDefault();act('scan',{})}});
document.addEventListener('change',e=>{if(e.target.id==='dC'){syncDraft();drawDraft()}});
$('#q').addEventListener('input',e=>{Q=e.target.value.trim();LIMIT=60;if(TAB==='catalog'){drawHead();$('#view').innerHTML=vCatalog()}else if(TAB==='orders'||TAB==='pay'){$('#view').innerHTML=TAB==='orders'?vOrders():vPay()}});
$('#addBtn').onclick=()=>act($('#addBtn').dataset.act,{});
$('#gearBtn').onclick=openSettings;
$('#onlineBtn').onclick=()=>toast(isClient()?'Ви в оптовому кабінеті':'Зараз у системі: '+['Андрій','Марічка','Тарас'].join(', '));
const rs=$('#roleSel');rs.innerHTML=Object.entries(ROLES).map(([k,r])=>`<option value="${k}">${r.name} — ${r.person}</option>`).join('');rs.value=S.role;
rs.onchange=()=>{S.role=rs.value;closeSheet();Object.keys(CF).forEach(k=>CF[k]=[]);OF='';Q='';$('#q').value='';render();toast(ROLE_DESC[S.role])};
render();
// мініатюри — окремим файлом, щоб сторінка відкривалась одразу
(function(){const s=document.createElement('script');s.src='thumbs.js';s.onload=()=>{Object.assign(TH,window.KALYNA_THUMBS||{});S.products.forEach(p=>{if(p.photo)TH[p.id]=p.photo;else if(p.noPhoto)delete TH[p.id]});if(!$('#sheet').classList.contains('open'))$('#view').innerHTML={catalog:vCatalog,orders:vOrders,pay:vPay,scan:vScan,journal:vJournal,stats:vStats,export:vExport}[TAB]()};document.body.appendChild(s)})();
</script>
